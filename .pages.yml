media:
  input: images
  output: /images

content:
  - name: site_content
    label: 綠州堡官網內容管理（全站單頁總管）
    type: file
    path: content.json
    fields:
      - name: notice
        label: "① 頂部最新公告（支援單行靜態 ／ Enter換行多則垂直輪播）"
        type: object
        fields:
          - name: active
            label: 總開關：是否顯示頂部公告橫幅
            type: boolean
            default: true
          - name: badge
            label: 前置標籤文字（如：節慶預購、公休通知；留白則僅顯示暖金呼吸圓點）
            type: string
          - name: text
            label: 公告內容（單行＝靜態顯示；按 Enter 換行輸入多行＝自動垂直淡入輪播）
            type: text
          - name: interval
            label: 多則輪播間隔秒數（預設 4.5 秒；系統限制範圍 2.5～12 秒）
            type: number
            default: 4.5

      - name: hero
        label: "② 首頁封面區（主視覺文字）"
        type: object
        fields:
          - name: subtitle
            label: 頂部小標（預設：SINCE 1999・高雄老字號・台灣百大伴手禮）
            type: string
          - name: title
            label: 品牌主標題（預設：綠州堡烘焙・大真烤壽桃）
            type: string
          - name: description
            label: 品牌核心標語（預設：「用心做好餅，是綠州堡最大的堅持。」）
            type: string

      - name: seasonal_meta
        label: "③-1 嚴選糕點專區 — 標題與總開關"
        type: object
        fields:
          - name: active
            label: 專區總開關（關閉時整區隱藏；開啟時僅顯示下方設為「上架」的商品）
            type: boolean
            default: true
          - name: eyebrow
            label: 英文小標（預設：HANDCRAFTED SELECTION）
            type: string
          - name: title
            label: 區塊主標題（預設：嚴選糕點與手作禮盒）
            type: string

      - name: seasonal_products
        label: "③-2 嚴選糕點專區 — 商品清單（支援分類篩選・1～3張多圖・草稿預排）"
        type: object
        list: true
        fields:
          - name: visible
            label: 上架狀態（綠色開啟 = 公開顯示 ／ 灰色關閉 = 暫不開放預排中）
            type: boolean
            default: true
          - name: category
            label: 系列分類（可直接輸入 4 字分類名稱，如：常態手作、節慶限定、伴手禮盒、經典熱銷）
            type: string
            default: 常態手作
          - name: name
            label: 商品名稱（如：歐式烤年糕、黑香蕉燒餅、中秋月餅）
            type: string
          - name: tag
            label: 特色小標（如：每日限量、人氣招牌、中秋限定；留白則不顯示）
            type: string
          - name: price
            label: 規格與價格說明（如：單入 / 禮盒裝，歡迎來電預訂）
            type: string
          - name: description
            label: 商品口感與特色介紹（支援 Enter 換行）
            type: text
          - name: images
            label: 商品照片集（可上傳或選取 1～3 張，第 1 張為主圖，支援拖曳調整順序）
            type: image
            list: true

      - name: faq_meta
        label: "④-1 常見訂購問答 FAQ — 標題與總開關"
        type: object
        fields:
          - name: active
            label: 總開關：是否顯示常見訂購問答區塊
            type: boolean
            default: true
          - name: title
            label: 區塊標題（預設：常見訂購與保存問答）
            type: string

      - name: faqs
        label: "④-2 常見訂購問答 FAQ — 問答清單（可自由增減）"
        type: object
        list: true
        fields:
          - name: visible
            label: 公開顯示（關閉則暫時隱藏該題）
            type: boolean
            default: true
          - name: question
            label: 顧客常問問題
            type: string
          - name: answer
            label: 詳細解答說明（支援 Enter 換行與空白縮排）
            type: text

      - name: store
        label: "⑤ 門市空間與聯絡資訊（含未來 LINE 預留）"
        type: object
        fields:
          - name: name
            label: 門市標題（如：本店 或 建興路本店）
            type: string
          - name: subtitle
            label: 門市副標題（預設：溫潤木質空間・誠心款待每一位來客）
            type: string
          - name: description
            label: 門市簡介段落
            type: text
          - name: highlights
            label: 門市特色亮點清單（建議維持 3 項，每項右側說明控制在 14 字內不折行）
            type: object
            list: true
            fields:
              - name: title
                label: 亮點標題（如：每日新鮮現烤）
                type: string
              - name: text
                label: 亮點說明（如：熱騰出爐，歡迎門市親自挑選）
                type: string
          - name: image
            label: 門市環境照片集（選 1 張＝靜態主圖；選 2～3 張＝慢速交叉淡入氛圍輪播）
            type: image
            list: true
          - name: fade_interval
            label: 門市多圖淡入切換秒數（預設 5 秒；系統限制範圍 3～15 秒）
            type: number
            default: 5
          - name: phone
            label: 服務專線
            type: string
          - name: hours
            label: 營業時間
            type: string
          - name: address
            label: 門市地址
            type: string
          - name: line_url
            label: 【未來擴充】LINE 官方帳號連結（留白則暫不顯示）
            type: string
          - name: line_label
            label: 【未來擴充】LINE 顯示文字（例如：加入官方 LINE 線上預訂）
            type: string
