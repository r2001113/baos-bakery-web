media:
  input: images
  output: /images

content:
  - name: site_content
    label: 綠州堡官網內容管理（全站單頁總管）
    type: file
    path: content.json
    fields:
      - name: notice
        label: "① 頂部最新公告（選填）"
        type: object
        fields:
          - name: active
            label: 總開關：是否顯示頂部公告橫幅
            type: boolean
            default: true
          - name: badge
            label: 前置標籤文字（如：節慶預購、公休通知；留白則不顯示標籤）
            type: string
          - name: text
            label: 公告內容（例如：中秋禮盒開放預購中，歡迎來電 07-390-3876）
            type: string

      - name: hero
        label: "② 首頁封面區（主視覺文字）"
        type: object
        fields:
          - name: subtitle
            label: 頂部小標（預設：SINCE 1999・高雄老字號・台灣百大伴手禮）
            type: string
          - name: title
            label: 品牌主標題（預設：綠州堡烘焙・大真烤壽桃）
            type: string
          - name: description
            label: 品牌核心標語（預設：「用心做好餅，是綠州堡最大的堅持。」）
            type: string

      - name: seasonal_meta
        label: "③-1 節慶限定專區 — 標題與總開關"
        type: object
        fields:
          - name: active
            label: 專區總開關（關閉時整區隱藏；開啟時僅顯示下方設為「上架」的商品）
            type: boolean
            default: true
          - name: eyebrow
            label: 英文小標（預設：SEASONAL SELECTION）
            type: string
          - name: title
            label: 區塊主標題（如：中秋限定禮盒、春節伴手禮精選）
            type: string

      - name: seasonal_products
        label: "③-2 節慶限定專區 — 商品清單（支援草稿預排・一鍵上下架）"
        type: object
        list: true
        fields:
          - name: visible
            label: 上架狀態（綠色開啟 = 公開顯示 ／ 灰色關閉 = 暫不開放預排中）
            type: boolean
            default: true
          - name: name
            label: 商品名稱（如：招牌蛋黃酥禮盒）
            type: string
          - name: tag
            label: 特色標籤（如：中秋限定、限量手作；留白則不顯示）
            type: string
          - name: price
            label: 規格與價格說明（如：8入 / 12入 禮盒裝，歡迎來電預訂）
            type: string
          - name: description
            label: 商品口感與特色介紹
            type: text
          - name: image
            label: 商品實拍照片
            type: image

      - name: faq_meta
        label: "④-1 常見訂購問答 FAQ — 標題與總開關"
        type: object
        fields:
          - name: active
            label: 總開關：是否顯示常見訂購問答區塊
            type: boolean
            default: true
          - name: title
            label: 區塊標題（預設：常見訂購與保存問答）
            type: string

      - name: faqs
        label: "④-2 常見訂購問答 FAQ — 問答清單（可自由增減）"
        type: object
        list: true
        fields:
          - name: visible
            label: 公開顯示（關閉則暫時隱藏該題）
            type: boolean
            default: true
          - name: question
            label: 顧客常問問題
            type: string
          - name: answer
            label: 詳細解答說明
            type: text

      - name: store
        label: "⑤ 建興路本店與聯絡資訊（含未來 LINE 預留）"
        type: object
        fields:
          - name: name
            label: 門市標題（預設：建興路本店）
            type: string
          - name: description
            label: 門市簡介段落
            type: text
          - name: image
            label: 門市環境照片
            type: image
          - name: phone
            label: 服務專線
            type: string
          - name: hours
            label: 營業時間
            type: string
          - name: address
            label: 門市地址
            type: string
          - name: line_url
            label: 【未來擴充】LINE 官方帳號連結（留白則暫不顯示）
            type: string
          - name: line_label
            label: 【未來擴充】LINE 顯示文字（例如：加入官方 LINE 線上預訂）
            type: string
